server:
  port: 8080

music:
  data:
    path: ./music-data

app:
  jwt:
    # 生产环境必须通过环境变量注入：
    #   export JWT_SECRET="$(openssl rand -base64 48)"
    # 默认值仅供本地演示；prod profile 下使用默认值会拒绝启动（见 SecretPolicy）。
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32b}
    expiration: 86400000
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}


siliconflow:
  api:
    key: ${SILICONFLOW_API_KEY}
    url: https://api.siliconflow.cn/v1/embeddings
  embedding:
    model: BAAI/bge-m3


spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:sqlite:./music-data/musicplayer.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://api.deepseek.com  # 把请求地址指向 DeepSeek
      chat:
        options:
          model: deepseek-chat # 使用 DeepSeek V3 模型 (便宜且支持 Function Calling)



  chat:
    client:
      template-renderer: none

#debug: true
